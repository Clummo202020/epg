<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Football on TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --chalk: #f4f6f1;
    --ink: #14233d;
    --muted: #5b6576;
    --line: #d6dce3;
    --field: #ffffff;
    --floodlight: #e8a317;
    --floodlight-ink: #3a2a00;
    --now: #1f7a4c;
    --chip: #e9edf2;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
    --board: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --chalk: #0f1a2c; --ink: #eef2f7; --muted: #9aa6b8; --line: #27344c; --field: #16233a;
      --floodlight: #f2b632; --floodlight-ink: #2a1e00; --now: #4fbf85; --chip: #1c2b45;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --chalk: #0f1a2c; --ink: #eef2f7; --muted: #9aa6b8; --line: #27344c; --field: #16233a;
    --floodlight: #f2b632; --floodlight-ink: #2a1e00; --now: #4fbf85; --chip: #1c2b45;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--chalk); color: var(--ink); font: 400 1.0625rem/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  main { max-width: 52rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font: 700 clamp(2.4rem, 7vw, 3.6rem)/0.95 var(--board); letter-spacing: -0.01em; margin: 0 0 0.4rem; }
  .lede { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.95rem; }
  .search { position: relative; }
  .search label, .filters label.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .search input {
    width: 100%; font: 600 1.5rem/1.2 var(--board); color: var(--ink); background: var(--field);
    border: 2px solid var(--ink); border-radius: 0.6rem; padding: 0.75rem 1rem;
  }
  .search input::placeholder { color: var(--muted); font-weight: 500; }
  input:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--floodlight); outline-offset: 2px; }
  .filters { display: flex; flex-wrap: wrap; gap: 0.6rem 0.5rem; align-items: center; margin: 0.9rem 0 0; }
  .filters select {
    font: 500 0.95rem var(--body); color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.45rem 0.6rem; max-width: 100%;
  }
  .chipbtn {
    font: 500 0.95rem var(--body); color: var(--ink); background: var(--chip); border: 1px solid var(--line);
    border-radius: 999px; padding: 0.35rem 0.85rem; cursor: pointer;
  }
  .chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--chalk); border-color: var(--ink); }
  .status { margin: 1.25rem 0 0; color: var(--muted); font-size: 0.95rem; min-height: 1.5em; }
  .status.error { color: var(--ink); border-left: 4px solid var(--floodlight); padding-left: 0.75rem; }
  .day { font: 600 1.05rem/1.2 var(--body); color: var(--muted); margin: 2.25rem 0 0.25rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--line); }
  .match { display: grid; grid-template-columns: 4.75rem 1fr; gap: 0 1rem; padding: 1.05rem 0; border-bottom: 1px solid var(--line); }
  .kickoff { font: 700 1.9rem/1 var(--board); font-variant-numeric: tabular-nums; padding-top: 0.1rem; }
  .title { font: 600 1.45rem/1.15 var(--board); margin: 0; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0.2rem 0 0; }
  .now { color: var(--now); font-weight: 600; margin-left: 0.4rem; }
  .chans { list-style: none; display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.65rem 0 0; padding: 0; }
  .chans li { background: var(--chip); border-radius: 0.4rem; padding: 0.15rem 0.55rem; font-size: 0.92rem; }
  .more { margin-top: 0.5rem; padding: 0; border: 0; background: none; color: var(--ink); font: 500 0.95rem var(--body); text-decoration: underline; cursor: pointer; }
  .empty { margin-top: 2rem; }
  .empty p { margin: 0 0 0.4rem; }
  .hint { color: var(--muted); }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; }
  @media (max-width: 30rem) {
    main { padding-top: 1.75rem; }
    .match { grid-template-columns: 3.9rem 1fr; gap: 0 0.75rem; }
    .kickoff { font-size: 1.6rem; }
    .title { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Football on TV</h1>
  <p class="lede">Matches in the coming days and the channels showing them. Times are UK time.</p>
  <form class="search" role="search" onsubmit="return false">
    <label for="q">Team, competition or channel</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
           placeholder="Team, competition or channel – e.g. Arsenal, Sky Sports" disabled>
  </form>
  <div class="filters" id="filters">
    <label class="vh" for="comp">Competition</label>
    <select id="comp" disabled><option value="">All competitions</option></select>
    <span id="days" role="group" aria-label="Day"></span>
  </div>
  <p class="status" id="status" aria-live="polite">Reading the fixtures…</p>
  <div id="results"></div>
  <footer id="footer"></footer>
</main>

<script>
(() => {
  "use strict";
  // The fixtures live next to this page first, then in the GitHub copy.
  const SOURCES = [
    "liveonsat_football.json",
    "https://raw.githubusercontent.com/Clummo202020/epg/main/liveonsat_football.json",
  ];
  const SHOW_CHANNELS = 14;            // channels shown before "Show all"
  const UNDER_WAY_MINUTES = 110;       // a match this long after kick-off is "under way"
  const DAY_CHOICES = [["all", "All upcoming"], ["today", "Today"], ["tomorrow", "Tomorrow"], ["three", "Next 3 days"]];

  const $ = (id) => document.getElementById(id);
  const q = $("q"), compSel = $("comp"), statusEl = $("status"), results = $("results"), daysEl = $("days");
  let fixtures = [];
  let fetched = null;
  let dayChoice = "all";

  const ukParts = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", hour: "numeric", minute: "2-digit", hourCycle: "h23" });
  const ukDay = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", weekday: "long", day: "numeric", month: "long" });
  const ukDayKey = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit" });

  function clock(d) {                  // 3pm, 5:45pm, 12:30am
    const p = ukParts.formatToParts(d);
    const h = +p.find((x) => x.type === "hour").value, m = +p.find((x) => x.type === "minute").value;
    return `${h % 12 || 12}${m ? ":" + String(m).padStart(2, "0") : ""}${h < 12 ? "am" : "pm"}`;
  }
  function fold(text) {
    return String(text).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/ı/g, "i").toLowerCase();
  }
  function esc(t) {
    return String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function dayKeys(offsets) {
    const now = Date.now();
    return new Set(offsets.map((n) => ukDayKey.format(new Date(now + n * 86400000))));
  }

  async function load() {
    const failures = [];
    for (const url of SOURCES) {
      try {
        const res = await fetch(url, { cache: "no-cache" });
        if (!res.ok) { failures.push(`${url}: HTTP ${res.status}`); continue; }
        const data = await res.json();
        if (!data || !Array.isArray(data.fixtures)) { failures.push(`${url}: not a fixtures file`); continue; }
        return data;
      } catch (e) {
        failures.push(`${url}: ${e.message || e}`);
      }
    }
    throw new Error(failures.join(" | "));
  }

  function prepare(data) {
    fetched = data.fetched ? new Date(data.fetched) : null;
    const cutoff = Date.now() - UNDER_WAY_MINUTES * 60000;
    fixtures = data.fixtures
      .map((f) => {
        const start = new Date(f.start);
        const ch = Array.isArray(f.ch) ? f.ch : [];
        const comp = String(f.comp || "").replace(/\s*-\s*(Round|Group|Week|Matchday|Leg|Game)\b.*$/i, "").trim() || "Football";
        return { start, a: f.a, b: f.b, compFull: f.comp || "", comp, ch,
                 hay: fold([f.a, f.b, f.comp, ch.join(" ")].join(" ")), dayKey: ukDayKey.format(start) };
      })
      .filter((f) => !isNaN(f.start) && f.start.getTime() >= cutoff)
      .sort((x, y) => x.start - y.start);
    const counts = {};
    for (const f of fixtures) counts[f.comp] = (counts[f.comp] || 0) + 1;
    const comps = Object.keys(counts).sort((x, y) => counts[y] - counts[x] || x.localeCompare(y));
    compSel.innerHTML = `<option value="">All competitions</option>` +
      comps.map((c) => `<option value="${esc(c)}">${esc(c)} (${counts[c]})</option>`).join("");
    compSel.disabled = false;
    q.disabled = false;
  }

  function buildDayChips() {
    daysEl.innerHTML = DAY_CHOICES.map(([k, label]) =>
      `<button type="button" class="chipbtn" data-day="${k}" aria-pressed="${k === dayChoice}">${label}</button>`).join(" ");
    for (const b of daysEl.querySelectorAll("button")) {
      b.addEventListener("click", () => { dayChoice = b.dataset.day; buildDayChips(); render(); });
    }
  }

  function filtered() {
    const words = fold(q.value).split(/[\s,]+/).filter((w) => w.length > 1);
    const comp = compSel.value;
    let allowed = null;
    if (dayChoice === "today") allowed = dayKeys([0]);
    else if (dayChoice === "tomorrow") allowed = dayKeys([1]);
    else if (dayChoice === "three") allowed = dayKeys([0, 1, 2]);
    return fixtures.filter((f) =>
      (!comp || f.comp === comp) && (!allowed || allowed.has(f.dayKey)) && words.every((w) => f.hay.includes(w)));
  }

  function dayLabel(key, sample) {
    const today = ukDayKey.format(new Date()), tomorrow = ukDayKey.format(new Date(Date.now() + 86400000));
    const base = ukDay.format(sample);
    return key === today ? `Today – ${base}` : key === tomorrow ? `Tomorrow – ${base}` : base;
  }

  function render() {
    const query = q.value.trim();
    const url = new URL(location.href);
    if (query) url.searchParams.set("q", query); else url.searchParams.delete("q");
    history.replaceState(null, "", url);
    const list = filtered();
    const stale = fetched && Date.now() - fetched.getTime() > 18 * 3600000;
    const updated = fetched ? ` Updated ${ukDay.format(fetched)}, ${clock(fetched)}.` : "";
    if (!list.length) {
      statusEl.textContent = "";
      results.innerHTML = `<div class="empty"><p>No matches${query ? ` for “${esc(query)}”` : ""} with these filters.</p>
        <p class="hint">Try a shorter name, another day, or “All competitions”.</p></div>`;
      return;
    }
    statusEl.textContent = `${list.length} ${list.length === 1 ? "match" : "matches"}.${updated}${stale ? " This list is more than 18 hours old." : ""}`;
    const now = Date.now();
    let html = "", lastDay = "";
    list.forEach((f, idx) => {
      if (f.dayKey !== lastDay) { html += `<h2 class="day">${esc(dayLabel(f.dayKey, f.start))}</h2>`; lastDay = f.dayKey; }
      const underway = f.start.getTime() <= now && now < f.start.getTime() + UNDER_WAY_MINUTES * 60000;
      const shown = f.ch.slice(0, SHOW_CHANNELS), rest = f.ch.slice(SHOW_CHANNELS);
      html += `<article class="match">
        <div class="kickoff">${esc(clock(f.start))}</div>
        <div>
          <p class="title">${esc(f.a)} v ${esc(f.b)}</p>
          <p class="sub">${esc(f.compFull || f.comp)}${underway ? '<span class="now">Under way</span>' : ""}</p>
          ${f.ch.length ? `<ul class="chans">${shown.map((c) => `<li>${esc(c)}</li>`).join("")}${
            rest.length ? `<li hidden data-rest="${idx}">${rest.map(esc).join('</li><li data-rest="' + idx + '">')}</li>` : ""}</ul>
          ${rest.length ? `<button type="button" class="more" data-more="${idx}">Show all ${f.ch.length} channels</button>` : ""}` :
            `<p class="sub">No channels listed yet.</p>`}
        </div>
      </article>`;
    });
    results.innerHTML = html;
    for (const b of results.querySelectorAll("button[data-more]")) {
      b.addEventListener("click", () => {
        for (const li of results.querySelectorAll(`li[data-rest="${b.dataset.more}"]`)) li.hidden = false;
        b.remove();
      });
    }
  }

  async function init() {
    buildDayChips();
    try {
      prepare(await load());
    } catch (e) {
      statusEl.className = "status error";
      statusEl.textContent = "Couldn’t read the fixtures: " + (e.message || e);
      return;
    }
    $("footer").textContent = "Start times and channel lists come from LiveOnSat; broadcasters can change schedules without notice. Not an EPG.";
    const initial = new URL(location.href).searchParams.get("q");
    if (initial) q.value = initial;
    q.addEventListener("input", render);
    compSel.addEventListener("change", render);
    render();
  }
  init();
})();
</script>
</body>
</html>
