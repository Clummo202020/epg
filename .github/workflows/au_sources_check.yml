name: AU sources check (one-off)

on:
  workflow_dispatch:         # only the "Run workflow" button - no schedule

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check ontvtonight and YourTV from the runner (read-only, nothing is committed)
        run: python3 -u au_sources_check.py
