# Runs SPORT_epg.py on GitHub's servers and commits the updated guide,
# overwriting SPORT_epg.xml.gz (gzip-compressed) so the raw link never changes.
# The translation cache (SPORT_translations.json) is committed too, so titles
# already translated are not translated again on every run.
#
# Put this file in the repository at:  .github/workflows/SPORT_epg.yml
# SPORT_epg.py (and SPORT_translations.json, if you have one) must be in the
# top level of the repository.

name: Update SPORT EPG

on:
  schedule:
    - cron: "0 12 * * *"     # every day at 06:00 UTC (07:00 UK summer time)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets the workflow commit the new files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the EPG
        run: python -u SPORT_epg.py --days 7     # -u: show the output live in the log

      - name: Commit the guide if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPORT_epg.xml.gz
          git rm --cached --ignore-unmatch --quiet SPORT_epg.xml   # the old uncompressed guide, if still there
          if [ -f SPORT_translations.json ]; then git add SPORT_translations.json; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update SPORT EPG"
            git pull --rebase
            git push
          fi
