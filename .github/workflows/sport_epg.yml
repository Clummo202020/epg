name: Update SPORT EPG

on:
  schedule:
    - cron: "23 3 * * *"    # 03:23 UTC (04:23 UK summer time, 03:23 winter)
    - cron: "23 15 * * *"   # 15:23 UTC (16:23 UK summer time, 15:23 winter)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions page

permissions:
  contents: write

concurrency:
  group: sport-epg          # never two of this workflow at once (the other one can run alongside)
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the guide
        run: python3 -u SPORT_epg.py   # -u shows progress in the log as it happens

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPORT_epg.xml.gz SPORT_translations.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update SPORT EPG"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase && git push; then ok=1; break; fi
              sleep 15
            done
            [ -n "$ok" ] || { echo "Push failed after 5 tries"; exit 1; }
          fi
