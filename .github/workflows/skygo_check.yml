name: Check Sky Go guide

on:
  workflow_dispatch:         # run by hand from the Actions page; nothing is committed

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the Sky Go guide (prints only)
        run: python3 -u skygo_check.py
