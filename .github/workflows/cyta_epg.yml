# Runs cyta_epg.py on GitHub's servers and commits the updated Cyta (Cyprus) guide,
# overwriting cyta_epg.xml so the raw link never changes. The translation cache
# (cyta_translations.json) is committed too, so Greek text already translated is
# not translated again on every run.
#
# Put this file in the repository at:  .github/workflows/cyta_epg.yml
# cyta_epg.py must be in the top level of the repository.

name: Update Cyta EPG

on:
  schedule:
    - cron: "30 6 * * *"     # every day at 06:30 UTC (07:30 UK summer time, 06:30 in winter)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets the workflow commit the new files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Build the Cyta EPG
        run: python -u cyta_epg.py              # -u: show the output live in the log

      - name: Commit the guide if it changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f cyta_epg.xml ]; then git add cyta_epg.xml; fi
          if [ -f cyta_translations.json ]; then git add cyta_translations.json; fi
          if [ -f cyta_epg_run.json ]; then git add cyta_epg_run.json; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Cyta EPG"
            git pull --rebase
            git push
          fi
