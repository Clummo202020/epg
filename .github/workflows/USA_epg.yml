name: Update USA EPG

on:
  schedule:
    - cron: "13 5 * * *"     # 05:13 UTC (06:13 UK summer time, 05:13 winter)
    - cron: "13 17 * * *"    # 17:13 UTC (18:13 UK summer time, 17:13 winter)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions page

permissions:
  contents: write

concurrency:
  group: usa-epg             # never two of this workflow at once (the others can run alongside)
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the USA and Canada sports guides (TV Passport)
        run: python3 -u USA_epg.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add USA_epg.xml.gz CANADA_epg.xml.gz
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update USA and Canada EPG"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase && git push; then ok=1; break; fi
              sleep 15
            done
            [ -n "$ok" ] || { echo "Push failed after 5 tries"; exit 1; }
          fi
