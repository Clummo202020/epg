name: Update football EPG

on:
  schedule:
    - cron: "30 5 * * *"    # 05:30 UTC (06:30 UK summer time, 05:30 winter)
    - cron: "30 17 * * *"   # 17:30 UTC (18:30 UK summer time, 17:30 winter)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions page

permissions:
  contents: write

concurrency:
  group: epg-commit          # never runs at the same moment as the SPORT update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the football guide
        run: python3 -u football_epg.py

      - name: Build the Scottish guide
        run: python3 -u scottish_epg.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football_epg.xml scottish_epg.xml
          for f in football_epg_run.json scottish_epg_run.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update football and Scottish EPG"
            git pull --rebase
            git push
          fi
