name: Update football EPG

on:
  schedule:
    - cron: "41 4 * * *"    # 04:41 UTC (05:41 UK summer time, 04:41 winter)
    - cron: "41 16 * * *"   # 16:41 UTC (17:41 UK summer time, 16:41 winter)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions page

permissions:
  contents: write

concurrency:
  group: football-epg          # never two of this workflow at once (the other one can run alongside)
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the football guide
        run: python3 -u football_epg.py

      - name: Build the Scottish guide
        run: python3 -u scottish_epg.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep this run's output aside, then put it on top of the LATEST repo each try.
          # (A rebase can't merge generated files, so if the repo changed during the run the push could fail.)
          mkdir -p /tmp/out
          cp football_epg.xml scottish_epg.xml /tmp/out/
          for f in football_epg_run.json scottish_epg_run.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/out/; fi
          done
          ok=""
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/out/football_epg.xml /tmp/out/scottish_epg.xml .
            git add football_epg.xml scottish_epg.xml
            for f in football_epg_run.json scottish_epg_run.json; do
              if [ -f "/tmp/out/$f" ]; then
                # run counters: keep the higher number
                python3 -c "
          import json, sys
          def num(p):
              try:
                  return int(json.load(open(p))['last_run'])
              except Exception:
                  return 0
          n = max(num('/tmp/out/$f'), num('$f'))
          json.dump({'last_run': n}, open('$f', 'w'))
          "
                git add "$f"
              fi
            done
            if git diff --cached --quiet; then echo "No changes"; ok=1; break; fi
            git commit -m "Update football and Scottish EPG"
            if git push origin HEAD:main; then ok=1; break; fi
            sleep 15
          done
          [ -n "$ok" ] || { echo "Push failed after 5 tries"; exit 1; }
