name: Update football EPG

on:
  schedule:
    - cron: "41 4 * * *"    # 04:41 UTC (05:41 UK summer time, 04:41 winter)
    - cron: "41 16 * * *"   # 16:41 UTC (17:41 UK summer time, 16:41 winter)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions page

permissions:
  contents: write

concurrency:
  group: football-epg          # never two of this workflow at once (the other one can run alongside)
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the football guide
        run: python3 -u football_epg.py

      - name: Build the Scottish guide
        run: python3 -u scottish_epg.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football_epg.xml scottish_epg.xml
          for f in football_epg_run.json scottish_epg_run.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update football and Scottish EPG"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase && git push; then ok=1; break; fi
              sleep 15
            done
            [ -n "$ok" ] || { echo "Push failed after 5 tries"; exit 1; }
          fi
