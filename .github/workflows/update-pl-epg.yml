name: Update Premier League EPG

on:
  schedule:
    - cron: "30 4 * * *"   # every day at 04:30 UTC (offset from the Arsenal workflow)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate EPG
        run: python pl_epg.py --fill -o pl_fixtures.xml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl_fixtures.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Premier League EPG $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
