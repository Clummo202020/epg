name: Update event EPG

on:
  schedule:
    - cron: "37 * * * *"     # every hour, at 37 minutes past (off the busy on-the-hour slot)
  workflow_dispatch:         # adds a "Run workflow" button on the Actions page

permissions:
  contents: write

concurrency:
  group: events-epg          # never two of this workflow at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the event guide (from the playlist's stream names)
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: |
          if [ -z "$PLAYLIST_URL" ]; then echo "No PLAYLIST_URL secret yet - add it under Settings > Secrets"; exit 1; fi
          python3 -u event_epg.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events_epg.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update event EPG"
            ok=""
            for i in 1 2 3 4 5; do
              if git pull --rebase && git push; then ok=1; break; fi
              sleep 15
            done
            [ -n "$ok" ] || { echo "Push failed after 5 tries"; exit 1; }
          fi
