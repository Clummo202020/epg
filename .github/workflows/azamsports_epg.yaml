name: Update Azam EPG

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run EPG generator script
        run: python azamsports_epg.py

      - name: Commit and push changes if EPG updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add azam_sports_epg.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Azam Sports EPG [skip ci]" && git push)
