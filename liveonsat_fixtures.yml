name: Update LiveOnSat fixtures

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # every 6 hours (a small hobby site - keep it light)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liveonsat-fixtures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read LiveOnSat's pages (rugby / fighting for the events guide, football for fixtures.html)
        run: python3 -u liveonsat_fixtures.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out
          for f in liveonsat_fixtures.json liveonsat_football.json; do [ -f "$f" ] && cp "$f" /tmp/out/; done
          if [ -z "$(ls /tmp/out)" ]; then echo "No file written"; exit 0; fi
          ok=""
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/out/*.json .
            git add liveonsat_fixtures.json liveonsat_football.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "No changes"; ok=1; break; fi
            git commit -m "Update LiveOnSat fixtures"
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((i * 5))
          done
          [ -n "$ok" ] || { echo "Push failed after 5 tries"; exit 1; }
